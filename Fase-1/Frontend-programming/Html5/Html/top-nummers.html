<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Trends Local - Top Nummers</title>
    <meta name="description" content="Ontdek welke artiest op dit moment populair is.">
    <meta name="keywords" content="Muziek, Artiest, Nummers">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../Css/animations.css">
</head>
<body class="bg-dark text-white">
    <header class="text-center py-4">
        <h1 class="fw-bold text-success">De Top Nummers</h1>
    </header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand text-success" href="./index.html">MTL</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="./top-artiesten.html">Top Artiesten</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./top-nummers.html">Top Nummers</a></li>
                    <li class="nav-item"><a class="nav-link" href="./genres.html">Genres</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container">
        <section class="text-center mb-4">
            <h2>De top nummers van tegenwoordig</h2>
            <p>Check hier welk nummer de populairste is</p>
        </section>
        <input 
            type="text" 
            id="searchInput" 
            class="form-control mb-4" 
            placeholder="Zoek een artiest..."
        >
        
        <ul id="nummerLijst" class="list-group"></ul>
        <button type="button" id="add_rickroll" class="btn btn-dark px-4" style="border-radius:10px;font-weight:500;">
            klik hier voor meer info
        </button>

        
        <div class="modal fade" id="rickroll" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content bg-black">
                    <video id="rickVideo" loop>
                        <source src="../Assets/Leuk-koekje (3).mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-black text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 Music Trends Local</p>
        <p class="mb-0">De volgorde van artiesten en genres is bepaald door AI word niet boos op mij</p>

        <!-- Capybara afbeelding -->
        <img src="https://www.rainforest-alliance.org/wp-content/uploads/2021/06/capybara-square-1.jpg.optimal.jpg" 
            alt="Capybara" 
            class="mt-3 img-fluid rounded"
            id="animate-fadeIn"
            style="max-width: 200px;">
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/animation.js"></script>
    <script src="../Js/script.js"></script>
</body>
</html>
